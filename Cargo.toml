[package]
name = "sentrygrid"
version = "0.1.0"
edition = "2021"
description = "Network exposure auditor — correlates ss, ufw, and docker to answer 'is this port actually reachable'"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cybercore = "0.4"
